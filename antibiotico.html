<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Antibiótico 3D</title>
<style>

#bb{position:fixed;z-index:3;left:50%;top:calc(8px + env(safe-area-inset-top,0px));width:min(560px,94%);display:none;pointer-events:none;text-align:center;transform:translateX(-50%);animation:drop .8s cubic-bezier(.2,1.3,.4,1) both}
@keyframes drop{from{transform:translate(-50%,-140%)}to{transform:translate(-50%,0)}}
#bbn{font:italic 800 clamp(12px,3.8vw,17px) Georgia,serif;letter-spacing:1px;white-space:nowrap;color:#ffd23f;text-shadow:0 0 10px #ff2d55,0 2px 0 #000;margin-bottom:4px}
#bbf{position:relative;padding:3px;border-radius:14px;background:linear-gradient(180deg,#ffe48a,#a8741a 50%,#ffe48a);box-shadow:0 0 16px rgba(255,45,85,.55),0 3px 8px #000}
#bbf::before,#bbf::after{content:'✦';position:absolute;top:-9px;font-size:20px;color:#ffd23f;text-shadow:0 0 8px #ff2d55}
#bbf::before{left:-8px}#bbf::after{right:-8px}
#bbi{position:relative;height:18px;border-radius:11px;background:#1a0509;overflow:hidden}
#bbt{position:absolute;left:0;top:0;bottom:0;width:100%;background:#ffb3a0;transition:width 1.2s ease .35s}
#bbh{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(180deg,#ff7a7a,#d4143a 55%,#8f0c28);box-shadow:inset 0 3px 4px rgba(255,255,255,.35),inset 0 -4px 6px rgba(0,0,0,.35);transition:width .15s;overflow:hidden}
#bbh::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);animation:shine 2.2s linear infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
#bbi .nt{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#ffd23f;opacity:.85}
#bbp{position:absolute;inset:0;font:700 12px Georgia,serif;line-height:18px;color:#fff;text-shadow:0 1px 2px #000}
#bbf.low{animation:pulse .5s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 28px rgba(255,45,85,.95),0 3px 8px #000}}
#bbf.hit{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
body.boss #hud,body.boss #og,body.boss #mu,body.boss #chb{transform:translateY(68px)}
body.intro #hud,body.intro #og,body.intro #js,body.intro #fb,body.intro #wb,body.intro #chb,body.intro #mu,body.intro #bb{visibility:hidden}
#skp{position:fixed;z-index:6;left:50%;bottom:calc(200px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;padding:10px 22px;border-radius:999px;border:2px solid #f6e6d6;background:rgba(13,4,7,.7);color:#f6e6d6;font:600 15px Georgia,serif}
#tt{position:fixed;z-index:9;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(340px,92%)}
#mu{position:fixed;z-index:1;top:calc(60px + env(safe-area-inset-top,0px));left:14px;width:40px;height:40px;border-radius:50%;border:1px solid #f6e6d6;background:rgba(13,4,7,.6);color:#f6e6d6;font-size:18px}
</style>
</head>
<body>
<canvas id="v"></canvas>
<div id="hud"><div id="bar"><div id="hp"></div></div><div id="cnt"></div></div>
<div id="og"></div>
<div id="js"><div id="kn"></div></div>
<button id="fb">Lanzar</button>
<button id="wb">Jeringa</button>
<div id="ov"><canvas id="bg"></canvas>
<div id="ovc">
<svg id="logo" viewBox="0 0 120 56"><g transform="rotate(-18 60 28)"><rect x="8" y="14" width="104" height="28" rx="14" fill="#fff"/><path d="M60 14H22a14 14 0 0 0 0 28h38z" fill="#ffd23f"/><rect x="8" y="14" width="104" height="28" rx="14" fill="none" stroke="#2a0b12" stroke-width="3"/><path d="M60 14v28" stroke="#2a0b12" stroke-width="3"/><rect x="20" y="19" width="34" height="5" rx="2.5" fill="#fff" opacity=".6"/></g></svg>
<small id="ovk">SHOOTER DENTRO DEL CUERPO</small>
<h1 id="ot">Antibiótico 3D</h1>
<p id="op">Sobrevive a 10 oleadas de bacterias: cada una trae más y más fuertes. Mini jefe en la oleada 5 y jefe final en la 10. Encadena eliminaciones para multiplicar tu puntuación.</p>
<button id="ob">Empezar</button>
<button id="dfb">Dificultad: Normal</button>
<div id="tiles">
<button id="sb" class="tile"><svg viewBox="0 0 48 32"><ellipse cx="24" cy="16" rx="22" ry="13" fill="#e8895a" stroke="#8a3b1c" stroke-width="2"/><path d="M10 16h6l2-7 3 14 3-14 3 14 2-7h6" fill="none" stroke="#8a3b1c" stroke-width="2"/></svg><span>Tienda</span></button>
<button id="nb" class="tile"><svg viewBox="0 0 48 32"><circle cx="24" cy="16" r="14" fill="#6fa8e8" stroke="#1f4f8f" stroke-width="2"/><circle cx="24" cy="16" r="5" fill="#1f4f8f"/></svg><span>Online</span></button>
<button id="frb" class="tile"><svg viewBox="0 0 48 32"><ellipse cx="13" cy="16" rx="9" ry="7" fill="#7fd08a" stroke="#2f7a3a" stroke-width="2"/><path d="M22 16q5-9 9 0t9 0 6 0" fill="none" stroke="#2f7a3a" stroke-width="2.5"/></svg><span>Amigos</span></button>
<button id="rkb" class="tile"><svg viewBox="0 0 48 32"><circle cx="24" cy="16" r="13" fill="#b26be0" stroke="#5b2a80" stroke-width="2"/><circle cx="19" cy="13" r="2.5" fill="#5b2a80"/><circle cx="27" cy="19" r="2.5" fill="#5b2a80"/><circle cx="26" cy="11" r="1.5" fill="#5b2a80"/></svg><span>Ranking</span></button>
</div>
<div id="how"><span>Joystick: moverte</span><span>Arrastrar: mirar</span><span>Botón: lanzar</span></div>
</div></div>
<div id="shp" class="pn"></div><div id="net" class="pn"></div><div id="frp" class="pn"></div><div id="lbp" class="pn"></div>
<div id="bk"><span id="bkt"></span><button id="bks">Tienda</button><button id="bkn">Siguiente oleada ya</button></div>
<button id="chb">Chat</button><div id="cl"></div>
<div id="cp"><div id="cpt"><button id="cpg" class="on">Global</button><button id="cpr">Grupo</button><button id="cpd">Privado</button><button id="cpx">✕</button></div><div id="cpf"></div><div id="cpl"></div><div id="cpi"><input id="cin" maxlength="120" placeholder="Escribe un mensaje…"><button id="cse">Enviar</button></div></div>
<div id="tt"></div>
<button id="skp">Saltar ▶</button>
<div id="bb"><div id="bbn"></div><div id="bbf"><div id="bbi"><div id="bbt"></div><div id="bbh"></div><i class="nt"></i><span id="bbp">100%</span></div></div></div>
<div id="qz" class="pn"><small id="qc"></small><h2 id="qt"></h2><div id="qa"></div><p id="qf"></p><button id="qn" class="pri" style="display:none">Continue</button></div>
<button id="mu">♪</button>
<script>
let M=["1111111111111111","1000000010000001","1011110010111101","1010000000100001","1010111110101011","1000100000001001","1110101111101101","1000001000000001","1011111011110111","1000000010000001","1011101010111101","1010001000000101","1010111111110101","1000000000000001","1011101111011101","1111111111111111"];
const MAZE=M,ARENA=Array.from({length:24},(_,y)=>Array.from({length:24},(_,x)=>x==0||y==0||x==23||y==23||((x==5||x==6||x==17||x==18)&&(y==5||y==6||y==17||y==18))?'1':'0').join(''));
const BS=[12,6],SPA=[[11.5,20.5],[12.5,20.5],[10.5,20.5],[13.5,20.5]];
const cv=document.getElementById('v'),c=cv.getContext('2d');
const W=320,H=200;cv.width=W;cv.height=H;
const PL=0.6,D=[[1,0],[-1,0],[0,1],[0,-1]],zb=new Float32Array(W);
const gc=c.createLinearGradient(0,0,0,H/2);gc.addColorStop(0,'#1a0810');gc.addColorStop(1,'#4a1522');
const gf=c.createLinearGradient(0,H/2,0,H);gf.addColorStop(0,'#0a0405');gf.addColorStop(1,'#3a1210');
let px,py,pa,hp,foes,shots,cd,hurt,rec,state='menu',jx=0,jy=0,fire=false,total=0;
const keys={};
let pts=0,inv=0,hsfx=0,pool=[],wave=1,score=0,best=0,combo=0,ct=0,bn=0,nextW=false,own=[1,0,0],sks=[1,0,0,0,0],wp=0,sk=0,df=1,ARN=0,bsh=[],intro=null,np=1,mi=0,kills=0,mk=0,ld=0,sa=0,rpv={};
const rp={},net={on:false,host:false,id:0,hostId:0,pin:'',ps:[],ws:null,brk:false},SP=[[1.5,1.5],[2.5,1.5],[1.5,2.5],[3.5,1.5]];
// [nombre, nº de bacterias, velocidad, daño recibido, puntos y score]
const DF=[['Fácil',.7,.85,.7,.6],['Normal',1,1,1,1],['Difícil',1.35,1.15,1.3,1.6],['Pesadilla',1.8,1.3,1.7,2.5]];const up={fr:0,pw:0,hp:0,sp:0};
try{const s=JSON.parse(localStorage.getItem('abx')||'{}');pts=s.pts|0;best=s.best|0;Object.assign(up,s.up||{});if(s.own)own=s.own;if(s.sks)sks=s.sks;wp=s.wp|0;sk=s.sk|0;if(!own[wp])wp=0;if(s.df!=null)df=Math.min(3,Math.max(0,s.df|0))}catch(e){}
const save=()=>{try{localStorage.setItem('abx',JSON.stringify({pts,up,best,own,sks,wp,sk,df}))}catch(e){}};
const mhp=()=>100+25*up.hp;
const los=f=>{for(let i=1;i<12;i++){const t=i/12;if(wall((px+(f.x-px)*t)|0,(py+(f.y-py)*t)|0))return false}return true};
const wall=(x,y)=>M[y]?.[x]!=='0';
const free=(x,y)=>!(wall((x+.2)|0,(y+.2)|0)||wall((x-.2)|0,(y+.2)|0)||wall((x+.2)|0,(y-.2)|0)||wall((x-.2)|0,(y-.2)|0));
function bfs(sx,sy){const F=M.map(r=>[...r].map(()=>-1));F[sy][sx]=0;const q=[[sx,sy]];
 while(q.length){const [x,y]=q.shift();for(const [ox,oy] of D){const nx=x+ox,ny=y+oy;if(!wall(nx,ny)&&F[ny][nx]<0){F[ny][nx]=F[y][x]+1;q.push([nx,ny])}}}return F}
function reset(nw){
 if(nw){wave++;hp=Math.min(mhp(),Math.max(hp,0)+30)}else{wave=1;score=0;hp=mhp();combo=0}ARN=wave===5?1:wave===10?2:0;M=ARN?ARENA:MAZE;bsh=[];const sp0=(ARN?SPA:SP)[mi];px=sp0[0];py=sp0[1];pa=ARN?-1.5708:0.3;inv=1.5;bn=2.2;renderOg();shots=[];cd=0;hurt=0;rec=0;foes=[];
 const F=bfs(1,1),cells=[];
 for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(F[y][x]>=7)cells.push([x,y]);
 cells.sort(()=>Math.random()-.5);if(net.on&&!net.host)cells.length=0;if(ARN)cells.length=0;
 for(const [x,y] of cells){if(foes.length>=Math.round((3+wave+Math.max(0,wave-5))*(1+.5*(np-1))*DF[df][1]))break;
  if(foes.every(f=>Math.hypot(f.x-x-.5,f.y-y-.5)>(np>1?1.1:1.7)))foes.push({x:x+.5,y:y+.5,hp:3+(wave>4)+(wave>8),fl:0,s:(.7+Math.random()*.4+wave*.06)*DF[df][2]})}
 if(ARN&&(!net.on||net.host))foes.push(makeBoss());total=foes.length;state=ARN?'intro':'play';if(ARN)introStart();ov.style.display='none';qz.style.display='none';bkHide();
}
function shoot(){let a=pa,bd=.35;
 for(const f of foes){const r=Math.atan2(f.y-py,f.x-px);let d=r-pa;d=Math.atan2(Math.sin(d),Math.cos(d));if(Math.abs(d)<bd&&los(f)){bd=Math.abs(d);a=r}}
 const sh={x:px+Math.cos(a)*.3,y:py+Math.sin(a)*.3,dx:Math.cos(a),dy:Math.sin(a),z:wp,d:(1+up.pw)*WP[wp][2],k:sk};if(net.on&&!net.host)tx2({k:'f',s:sh},1);else shots.push(sh);cd=WP[wp][1]*(1-.15*up.fr);rec=1;sfx(wp==2?'cannon':'shoot')}
function update(dt){
 const ts=v=>Math.abs(v)<.3?0:Math.sign(v)*(Math.abs(v)-.3)/.7,dz=v=>Math.abs(v)<.15?0:v;
 const act=state==='play'?1:0,hostm=!net.on||net.host;
 pa+=((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*1.9*dt*act;const sd=(dz(jx)+(keys.KeyD?1:0)-(keys.KeyA?1:0))*3*(1+.15*up.sp)*dt*act;
 const m=(-dz(jy)+(keys.ArrowUp||keys.KeyW?1:0)-(keys.ArrowDown||keys.KeyS?1:0))*3*(1+.15*up.sp)*dt*act;
 const nx=px+Math.cos(pa)*m-Math.sin(pa)*sd,ny=py+Math.sin(pa)*m+Math.cos(pa)*sd;
 if(free(nx,py))px=nx;if(free(px,ny))py=ny;
 cd-=dt;rec=Math.max(0,rec-dt*5);
 if(act&&(fire||keys.Space)&&cd<=0)shoot();

 cpl.scrollTop=1e9;cpg.className=chS==='g'?'on':'';cpr.className=chS==='r'?'on':'';cpd.className=dm?'on':'';

// ---- jefes: arenas, introducción saltable y barra de vida ----
const BN=['','ESTAFILOCOCO REY','SUPERBACTERIA RESISTENTE'],BSUB=['','MINI JEFE','JEFE FINAL'];
const skp=document.getElementById('skp'),bb=document.getElementById('bb'),bbn=document.getElementById('bbn'),bbf=document.getElementById('bbf'),bbh=document.getElementById('bbh'),bbt=document.getElementById('bbt'),bbp=document.getElementById('bbp');
let bbOn=0,bbLast=1;
function makeBoss(){const b=ARN===1?{hp:70,s:.75,rad:1.1,dmg:30,cd:3,sc:6}:{hp:180,s:.9,rad:1.5,dmg:40,cd:2.5,sc:5};
 b.hp=Math.round(b.hp*(1+.6*(np-1))*DF[df][1]);b.mx=b.hp;b.bt=ARN;b.x=BS[0];b.y=BS[1];b.fl=0;return b}
function introStart(){intro={t:0,dur:5,px,py,pa};skp.style.display='block';sfx('boss')}
function skipIntro(){if(state!=='intro'||!intro)return;px=intro.px;py=intro.py;pa=intro.pa;intro=null;skp.style.display='none';state='play';cd=.4}
function introTick(dt){if(!intro)return;intro.t+=dt;const T=Math.min(1,intro.t/intro.dur),e=T*T*(3-2*T);
 px=BS[0]+Math.sin(T*2.4)*1.4;py=BS[1]+11-6.4*e;pa=Math.atan2(BS[1]-py,BS[0]-px)+(T>.85?Math.sin(intro.t*45)*.012:0);
 if(intro.t>=intro.dur)skipIntro()}
skp.onclick=skipIntro;
bbf.onanimationend=()=>bbf.classList.remove('hit');
function bossBar(){const B=state==='intro'?null:foes.find(f=>f.bt);
 if(!B){if(bbOn){bb.style.display='none';document.body.classList.remove('boss');bbOn=0}return}
 const fr=Math.max(0,B.hf!=null?B.hf:B.hp/B.mx);
 if(!bbOn){bbOn=1;bb.style.display='block';document.body.classList.add('boss');bbLast=fr}
 const nm=BN[B.bt]+(fr<.5?' ¡FURIA!':'');if(bbn.textContent!==nm)bbn.textContent=nm;
 const pw=(fr*100).toFixed(1)+'%';bbh.style.width=pw;bbt.style.width=pw;bbp.textContent=Math.ceil(+(fr*100).toFixed(2))+'%';
 bbf.classList.toggle('low',fr<.25);
 if(fr<bbLast-.004){bbf.classList.remove('hit');void bbf.offsetWidth;bbf.classList.add('hit')}
 bbLast=fr}
function bossTick(dt,TG){const B=foes.find(f=>f.bt);
 for(let i=bsh.length-1;i>=0;i--){const s=bsh[i];s.x+=s.dx*s.sp*dt;s.y+=s.dy*s.sp*dt;s.l-=dt;let hit=s.l<=0||wall(s.x|0,s.y|0);
  if(!hit)for(const q of TG)if(Math.hypot(q.x-s.x,q.y-s.y)<.5){hit=true;const dmg=s.d*DF[df][3];
   if(q.l){if(inv<=0){hp-=dmg;hurt=.45;if(hsfx<=0){sfx('hurt');hsfx=.4}}}else if(!q.r.iv)q.r.dm+=dmg;break}
  if(hit)bsh.splice(i,1)}
 if(!B||!TG.length)return;
 const ph=B.hp<B.mx*.5?2:1;
 if(ph===2&&!B.enr){B.enr=1;B.s*=1.35;sfx('boss')}
 B.cd-=dt;B.sc-=dt;
 if(B.cd<=0){B.cd=B.bt===2?(ph===2?1.2:1.8):2.6;
  let t=TG[0],bq=1e9;for(const q of TG){const dd=Math.hypot(B.x-q.x,B.y-q.y);if(dd<bq){bq=dd;t=q}}
  const a0=Math.atan2(t.y-B.y,t.x-B.x),n=B.bt===2?(ph===2?5:3):1;
  for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*.28;bsh.push({x:B.x,y:B.y,dx:Math.cos(a),dy:Math.sin(a),sp:B.bt===2?4.2:3.4,l:6,d:B.bt===2?18:14,bt:B.bt})}
  sfx('cannon')}
 if(B.sc<=0){B.sc=B.bt===2?(ph===2?6:8):10;
  const m=B.bt===2?(ph===2?4:3):2;
  for(let i=0;i<m&&foes.length<16;i++){const a=Math.random()*6.28,x=B.x+Math.cos(a)*2.2,y=B.y+Math.sin(a)*2.2;
   if(!wall(x|0,y|0))foes.push({x,y,hp:2+(ph===2?1:0),fl:0,s:(1+Math.random()*.4)*DF[df][2]})}}}
function drawBossCol(e,x,u,h,cy,sz,k,fl){const bt=e.o.bt,T=Date.now()/1000;
 const hh=h*(1+(Math.abs(u)>.6?.09:.04)*Math.sin(u*16+T*4));
 const base=bt==1?[196,206,64]:[210,36,58],rim=bt==1?[110,140,30]:[110,12,40],kk=Math.max(.35,k*1.15);
 const col=(a,add)=>'rgb('+Math.min(255,a[0]*kk+add|0)+','+Math.min(255,a[1]*kk+add|0)+','+Math.min(255,a[2]*kk+add|0)+')';
 c.fillStyle=fl?'#fff':col(base,0);c.fillRect(x,cy-hh/2,1,hh);
 c.fillStyle=fl?'#fff':col(base,45);c.fillRect(x,cy-hh/2,1,hh*.22);
 if(Math.abs(u)>.88){c.fillStyle=col(rim,0);c.fillRect(x,cy-hh/2,1,hh)}
 const ey=cy-sz*.12,eh=sz*.1;
 if(bt==1){const d=Math.abs(Math.abs(u)-.3);if(d<.13){c.fillStyle='#fff';c.fillRect(x,ey-eh/2,1,eh);if(d<.06){c.fillStyle='#1a0508';c.fillRect(x,ey-eh/4,1,eh/2)}}}
 else{for(const o of[-.45,0,.45])if(Math.abs(u-o)<.09){c.fillStyle=(T*3|0)%2||fl?'#ffe14d':'#ff9d2e';c.fillRect(x,ey-eh/2,1,eh)}
  if(Math.abs(u)<.5){c.fillStyle='#2a0508';c.fillRect(x,cy+sz*.1,1,sz*.05)}}}
let lt=0,ltT=null;

let jp=null;const R=50;
function mv(e){const r=js.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;const l=Math.hypot(x,y);if(l>R){x*=R/l;y*=R/l}jx=x/R;jy=y/R;kn.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`}

const bgc=document.getElementById('bg'),bx=bgc.getContext('2d');
const bgCells=Array.from({length:16},(_,i)=>({x:Math.random(),y:Math.random(),r:12+Math.random()*34,vx:(Math.random()-.5)*.05,vy:(Math.random()-.5)*.05,p:Math.random()*6,t:i%3}));
const bgPills=Array.from({length:3},()=>({x:Math.random(),y:Math.random(),a:Math.random()*6,s:.12+Math.random()*.1}));
function bgDraw(){if(ov.style.display==='none')return;
 const w=ov.clientWidth||320,h=ov.clientHeight||600,T=Date.now()/1000;
 if(bgc.width!==w)bgc.width=w;if(bgc.height!==h)bgc.height=h;bx.clearRect(0,0,w,h);
 bgCells.forEach(o=>{o.x=(o.x+o.vx*.033+1)%1;o.y=(o.y+o.vy*.033+1)%1;
  const r=o.r*(1+.05*Math.sin(T*1.5+o.p));bx.save();bx.translate(o.x*w,o.y*h);bx.lineWidth=2;
  if(o.t===1){bx.rotate(o.p+T*.1);bx.fillStyle='rgba(127,208,138,.2)';bx.strokeStyle='rgba(127,208,138,.4)';bx.beginPath();bx.ellipse(0,0,r,r*.45,0,0,7);bx.fill();bx.stroke();
   bx.beginPath();bx.moveTo(r,0);for(let i=1;i<=8;i++)bx.lineTo(r+i*r*.2,Math.sin(T*4+i+o.p)*r*.25);bx.stroke()}
  else{bx.fillStyle=o.t?'rgba(178,107,224,.16)':'rgba(255,120,140,.16)';bx.strokeStyle=o.t?'rgba(178,107,224,.4)':'rgba(255,150,170,.4)';bx.beginPath();bx.arc(0,0,r,0,7);bx.fill();bx.stroke();bx.fillStyle='rgba(255,255,255,.12)';bx.beginPath();bx.arc(r*.2,-r*.1,r*.35,0,7);bx.fill()}
  bx.restore()});
 bgPills.forEach(p=>{p.x=(p.x+p.s*.033*Math.cos(p.a)+1)%1;p.y=(p.y+p.s*.033*Math.sin(p.a)+1)%1;bx.save();bx.translate(p.x*w,p.y*h);bx.rotate(p.a+T*.6);bx.fillStyle='rgba(255,210,63,.55)';bx.fillRect(-14,-6,14,12);bx.fillStyle='rgba(255,255,255,.55)';bx.fillRect(0,-6,14,12);bx.restore()})}
if(!(typeof matchMedia!=='undefined'&&matchMedia('(prefers-reduced-motion: reduce)').matches))setInterval(bgDraw,33);else bgDraw();
