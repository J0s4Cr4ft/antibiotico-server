<body>
<canvas id="v"></canvas>
<div id="hud"><div id="bar"><div id="hp"></div></div><div id="cnt"></div></div>
<div id="og"></div>
<div id="js"><div id="kn"></div></div>
<button id="fb">Lanzar</button>
<button id="wb">Jeringa</button>
<div id="ov"><h1 id="ot">Antibiótico 3D</h1><p id="op">Sobrevive a 10 oleadas de bacterias: cada una trae más y más fuertes. Encadena eliminaciones para multiplicar tu puntuación. Joystick izquierdo para moverte, arrastra el dedo por la pantalla para mirar y pulsa el botón derecho para lanzar antibióticos.</p><button id="ob">Empezar</button><button id="dfb">Dificultad: Normal</button><button id="sb">Tienda</button><button id="nb">Jugar online</button><button id="frb">Amigos</button><button id="rkb">Ranking</button></div>
<div id="shp" class="pn"></div><div id="net" class="pn"></div><div id="frp" class="pn"></div><div id="lbp" class="pn"></div>
<div id="bk"><span id="bkt"></span><button id="bks">Tienda</button><button id="bkn">Siguiente oleada ya</button></div>
<button id="chb">Chat</button><div id="cl"></div>
<div id="cp"><div id="cpt"><button id="cpg" class="on">Global</button><button id="cpr">Grupo</button><button id="cpx">✕</button></div><div id="cpl"></div><div id="cpi"><input id="cin" maxlength="120" placeholder="Escribe un mensaje…"><button id="cse">Enviar</button></div></div>
<div id="tt"></div>
<div id="qz" class="pn"><small id="qc"></small><h2 id="qt"></h2><div id="qa"></div><p id="qf"></p><button id="qn" class="pri" style="display:none">Continue</button></div>
<button id="mu">♪</button>
<script>
const M=["1111111111111111","1000000010000001","1011110010111101","1010000000100001","1010111110101011","1000100000001001","1110101111101101","1000001000000001","1011111011110111","1000000010000001","1011101010111101","1010001000000101","1010111111110101","1000000000000001","1011101111011101","1111111111111111"];
const cv=document.getElementById('v'),c=cv.getContext('2d');
const W=320,H=200;cv.width=W;cv.height=H;
const PL=0.6,D=[[1,0],[-1,0],[0,1],[0,-1]],zb=new Float32Array(W);
const gc=c.createLinearGradient(0,0,0,H/2);gc.addColorStop(0,'#1a0810');gc.addColorStop(1,'#4a1522');
const gf=c.createLinearGradient(0,H/2,0,H);gf.addColorStop(0,'#0a0405');gf.addColorStop(1,'#3a1210');
let px,py,pa,hp,foes,shots,cd,hurt,rec,state='menu',jx=0,jy=0,fire=false,total=0;
const keys={};
let pts=0,inv=0,hsfx=0,pool=[],wave=1,score=0,best=0,combo=0,ct=0,bn=0,nextW=false,own=[1,0,0],sks=[1,0,0,0,0],wp=0,sk=0,df=1,np=1,mi=0,kills=0,mk=0,ld=0,sa=0,rpv={};
const rp={},net={on:false,host:false,id:0,hostId:0,pin:'',ps:[],ws:null,brk:false},SP=[[1.5,1.5],[2.5,1.5],[1.5,2.5],[3.5,1.5]];
// [nombre, nº de bacterias, velocidad, daño recibido, puntos y score]
const DF=[['Fácil',.7,.85,.7,.6],['Normal',1,1,1,1],['Difícil',1.35,1.15,1.3,1.6],['Pesadilla',1.8,1.3,1.7,2.5]];const up={fr:0,pw:0,hp:0,sp:0};
try{const s=JSON.parse(localStorage.getItem('abx')||'{}');pts=s.pts|0;best=s.best|0;Object.assign(up,s.up||{});if(s.own)own=s.own;if(s.sks)sks=s.sks;wp=s.wp|0;sk=s.sk|0;if(!own[wp])wp=0;if(s.df!=null)df=Math.min(3,Math.max(0,s.df|0))}catch(e){}
const save=()=>{try{localStorage.setItem('abx',JSON.stringify({pts,up,best,own,sks,wp,sk,df}))}catch(e){}};
const mhp=()=>100+25*up.hp;
const los=f=>{for(let i=1;i<12;i++){const t=i/12;if(wall((px+(f.x-px)*t)|0,(py+(f.y-py)*t)|0))return false}return true};
const wall=(x,y)=>M[y]?.[x]!=='0';
const free=(x,y)=>!(wall((x+.2)|0,(y+.2)|0)||wall((x-.2)|0,(y+.2)|0)||wall((x+.2)|0,(y-.2)|0)||wall((x-.2)|0,(y-.2)|0));
function bfs(sx,sy){const F=M.map(r=>[...r].map(()=>-1));F[sy][sx]=0;const q=[[sx,sy]];
 while(q.length){const [x,y]=q.shift();for(const [ox,oy] of D){const nx=x+ox,ny=y+oy;if(!wall(nx,ny)&&F[ny][nx]<0){F[ny][nx]=F[y][x]+1;q.push([nx,ny])}}}return F}
function reset(nw){
 px=SP[mi][0];py=SP[mi][1];pa=0.3;if(nw){wave++;hp=Math.min(mhp(),Math.max(hp,0)+30)}else{wave=1;score=0;hp=mhp();combo=0}inv=1.5;bn=2.2;renderOg();shots=[];cd=0;hurt=0;rec=0;foes=[];
 const F=bfs(1,1),cells=[];
 for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(F[y][x]>=7)cells.push([x,y]);
 cells.sort(()=>Math.random()-.5);if(net.on&&!net.host)cells.length=0;
 for(const [x,y] of cells){if(foes.length>=Math.round((3+wave+Math.max(0,wave-5))*(1+.5*(np-1))*DF[df][1]))break;
  if(foes.every(f=>Math.hypot(f.x-x-.5,f.y-y-.5)>(np>1?1.1:1.7)))foes.push({x:x+.5,y:y+.5,hp:3+(wave>4)+(wave>8),fl:0,s:(.7+Math.random()*.4+wave*.06)*DF[df][2]})}
 total=foes.length;state='play';ov.style.display='none';qz.style.display='none';bkHide();
}
function shoot(){let a=pa,bd=.35;
 for(const f of foes){const r=Math.atan2(f.y-py,f.x-px);let d=r-pa;d=Math.atan2(Math.sin(d),Math.cos(d));if(Math.abs(d)<bd&&los(f)){bd=Math.abs(d);a=r}}
 const sh={x:px+Math.cos(a)*.3,y:py+Math.sin(a)*.3,dx:Math.cos(a),dy:Math.sin(a),z:wp,d:(1+up.pw)*WP[wp][2],k:sk};if(net.on&&!net.host)tx2({k:'f',s:sh},1);else shots.push(sh);cd=WP[wp][1]*(1-.15*up.fr);rec=1;sfx(wp==2?'cannon':'shoot')}
function update(dt){
 const ts=v=>Math.abs(v)<.3?0:Math.sign(v)*(Math.abs(v)-.3)/.7,dz=v=>Math.abs(v)<.15?0:v;
 const act=state==='play'?1:0,hostm=!net.on||net.host;
 pa+=((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*1.9*dt*act;const sd=(dz(jx)+(keys.KeyD?1:0)-(keys.KeyA?1:0))*3*(1+.15*up.sp)*dt*act;
 const m=(-dz(jy)+(keys.ArrowUp||keys.KeyW?1:0)-(keys.ArrowDown||keys.KeyS?1:0))*3*(1+.15*up.sp)*dt*act;
 const nx=px+Math.cos(pa)*m-Math.sin(pa)*sd,ny=py+Math.sin(pa)*m+Math.cos(pa)*sd;
 if(free(nx,py))px=nx;if(free(px,ny))py=ny;
 cd-=dt;rec=Math.max(0,rec-dt*5);
 if(act&&(fire||keys.Space)&&cd<=0)shoot();
 if(!hostm){hurt=Math.max(0,hurt-dt*1.5);inv-=dt;hsfx-=dt;bn-=dt;if(hp<=0&&state==='play')ask();return}
 if(net.on)hostSnap(dt);
 for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.x+=s.dx*8*dt;s.y+=s.dy*8*dt;
  if(wall(s.x|0,s.y|0)){shots.splice(i,1);continue}
  for(const f of foes)if(Math.hypot(f.x-s.x,f.y-s.y)<.45){f.hp-=s.d;f.fl=.15;sfx('hit');shots.splice(i,1);break}}
 const n0=foes.length;foes=foes.filter(f=>f.hp>.01);if(foes.length<n0){const k=n0-foes.length;combo=Math.min(5,(ct>0?combo:0)+k);ct=2.5;pts+=Math.round(k*10*DF[df][4]);kills+=k;score+=Math.round(k*10*wave*combo*DF[df][4]);save();sfx('pop')}ct-=dt;bn-=dt;
 const TG=[];if(state==='play'&&hp>0)TG.push({x:px,y:py,l:1});for(const id in rp)if(rp[id].st==1)TG.push({x:rp[id].x,y:rp[id].y,r:rp[id]});
 if(net.on&&!TG.length&&state!=='quiz'&&!Object.values(rp).some(r=>r.st==2)){netEnd(0);end('Te han infectado','Las bacterias ganaron esta vez.','Jugar de nuevo');return}
 TG.forEach(t=>t.F=bfs(t.x|0,t.y|0));
 for(const f of foes){
  let tg=null,bq=1e9;for(const q of TG){const dd=Math.hypot(f.x-q.x,f.y-q.y);if(dd<bq){bq=dd;tg=q}}if(!tg)continue;const F=tg.F,px=tg.x,py=tg.y;const cx=f.x|0,cy=f.y|0;let bx=cx,by=cy,bd=F[cy][cx];
  for(const [ox,oy] of D){const a=cx+ox,b=cy+oy;if(F[b]?.[a]>=0&&F[b][a]<bd){bd=F[b][a];bx=a;by=b}}
  const tx=bd===0?px:bx+.5,ty=bd===0?py:by+.5,an=Math.atan2(ty-f.y,tx-f.x);
  f.x+=Math.cos(an)*f.s*dt;f.y+=Math.sin(an)*f.s*dt;f.fl=Math.max(0,f.fl-dt);
  for(const q of TG)if(Math.hypot(f.x-q.x,f.y-q.y)<.55){if(q.l){if(inv<=0){hp-=22*DF[df][3]*dt;hurt=.45;if(hsfx<=0){sfx('hurt');hsfx=.4}}}else if(!q.r.iv)q.r.dm+=22*DF[df][3]*dt}}inv-=dt;hsfx-=dt;
 hurt=Math.max(0,hurt-dt*1.5);
 if(hp<=0&&state==='play'){ask()}
 else if(!foes.length&&!net.brk&&total>0){const b=Math.round((100*wave+Math.max(0,Math.round(hp)))*DF[df][4]);score+=b;pts+=Math.round(25*DF[df][4]);
 if(wave>=10){pts+=Math.round(100*DF[df][4]);score+=Math.round(1000*DF[df][4]);netEnd(1);end('Infección eliminada','Has superado las 10 oleadas. ¡Ganaste!','Jugar de nuevo')}
 else wavedone(b)}
}
function wavedone(b){if(net.on){net.brk=true;state='between';save();sfx('win');tx2({k:'wd',t:20});bkShow(20);net.tm=setTimeout(hostNext,20000);return}state='between';save();sfx('win');ot.textContent='Oleada '+wave+' superada';op.textContent='Bonificación +'+b+'. Puntuación: '+score+'. Recuperas algo de vida; gasta tus puntos en la tienda antes de seguir.';ob.textContent='Oleada '+(wave+1);nextW=true;ov.style.display='flex'}
function end(t,p,b){state='over';nextW=false;net.brk=false;qz.style.display='none';submitScore();if(net.on)closeNet();if(score>best)best=score;save();sfx(t[0]=='I'?'win':'lose');p+=' Oleada '+wave+'/10. Puntuación: '+score+'. Récord: '+best+'.';ot.textContent=t;op.textContent=p;ob.textContent=b;ov.style.display='flex'}
function render(){
 c.fillStyle=gc;c.fillRect(0,0,W,H/2);c.fillStyle=gf;c.fillRect(0,H/2,W,H/2);
 const dx=Math.cos(pa),dy=Math.sin(pa),plx=-dy*PL,ply=dx*PL;
 for(let i=0;i<W;i++){
  const cx=2*i/W-1,rx=dx+plx*cx,ry=dy+ply*cx;
  let mx=px|0,my=py|0,ddx=Math.abs(1/rx),ddy=Math.abs(1/ry),sx,sy,sdx,sdy,side=0;
  if(rx<0){sx=-1;sdx=(px-mx)*ddx}else{sx=1;sdx=(mx+1-px)*ddx}
  if(ry<0){sy=-1;sdy=(py-my)*ddy}else{sy=1;sdy=(my+1-py)*ddy}
  for(let n=0;n<40;n++){if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}if(wall(mx,my))break}
  const d=Math.max(.05,side?sdy-ddy:sdx-ddx);zb[i]=d;
  let wx=side?px+d*rx:py+d*ry;wx-=Math.floor(wx);
  const memb=(mx*3+my*5)%4===0,b=memb?[60,150,170]:[205,75,95];
  let k=(1/(1+d*d*.13))*(side?.72:1)*(.88+.12*Math.sin(wx*32+my));
  if(wx<.04||wx>.96)k*=.7;
  const lh=Math.min(H*4,H*.95/d);
  c.fillStyle=`rgb(${b[0]*k|0},${b[1]*k|0},${b[2]*k|0})`;c.fillRect(i,(H-lh)/2,1,lh);
 }
 const inv=1/(plx*dy-dx*ply),list=[];
 for(const f of foes)list.push({o:f,t:0});for(const s of shots)list.push({o:s,t:1});for(const q of others())list.push({o:{x:q[0],y:q[1]},t:2,q});
 for(const e of list){const o=e.o,ax=o.x-px,ay=o.y-py;e.tx=inv*(dy*ax-dx*ay);e.ty=inv*(-ply*ax+plx*ay)}
 list.sort((a,b)=>b.ty-a.ty);
 for(const e of list){
  if(e.ty<.15)continue;
  const sx=(W/2)*(1+e.tx/e.ty),sz=(H/e.ty)*(e.t==2?.55:e.t?(e.o.z==2?.34:e.o.z==1?.12:.2):.7),cy=H/2+(H/e.ty)*(e.t==2?.12:e.t?.05:.18);
  const k=1/(1+e.ty*e.ty*.08);
  for(let x=Math.max(0,Math.floor(sx-sz/2));x<=Math.min(W-1,Math.ceil(sx+sz/2));x++){
   if(e.ty>=zb[x])continue;
   const u=(x-sx)/(sz/2),h=sz*Math.sqrt(Math.max(0,1-u*u))*(e.t==1?.6:1);
   if(e.t==2){c.globalAlpha=Math.max(.4,k);c.fillStyle=SK[e.q[2]][1];c.fillRect(x,cy-h/2,1,h);c.fillStyle='#fff';c.fillRect(x,cy-h/2,1,h*.25);if(Math.abs(u)<.5){c.fillStyle='#10202a';c.fillRect(x,cy-h*.3,1,h*.15)}c.globalAlpha=1;continue}
   if(e.t){c.fillStyle=u<0?SK[e.o.k||0][1]:SK[e.o.k||0][2];c.fillRect(x,cy-h/2,1,h);continue}
   const fl=e.o.fl>0;
   c.fillStyle=fl?'#fff':`rgb(${70*k|0},${190*k|0},${80*k|0})`;c.fillRect(x,cy-h/2,1,h);
   c.fillStyle=fl?'#fff':`rgb(${150*k|0},${240*k|0},${130*k|0})`;c.fillRect(x,cy-h/2,1,h*.3);
   if(Math.abs(u)>.85){c.fillStyle=`rgb(${30*k|0},${100*k|0},${40*k|0})`;c.fillRect(x,cy-h/2,1,h)}
   if(Math.abs(Math.abs(u)-.32)<.12){c.fillStyle='#1a0508';c.fillRect(x,cy-sz*.14,1,sz*.2)}
  }

 w.onmessage=e=>{try{netMsg(JSON.parse(e.data))}catch(x){}};
 w.onerror=()=>{if(nt.style.display==='flex'&&!net.pin)netUI('No se pudo conectar a '+srvUrl()+'. Comprueba que el servidor esté encendido y, si hace falta, escribe abajo su dirección (p. ej. mi-juego.up.railway.app) y pulsa Conectar.')};
 w.onclose=()=>{net.ws=null;pres={};if(net.on||net.pin)leaveNet('Conexión perdida.');if(net.was)setTimeout(()=>connect(true),8000)}}
function openNet(){if(net.ws&&net.ws.readyState===1){netUI();return}netUI('Conectando a '+srvUrl()+'…');connect(false)}
nb.onclick=openNet;
// ---- panel online / lobby ----
function netUI(msg){nt.innerHTML='';const add=mkAdd(nt);
 if(!net.pin){add('h2','Jugar online');
  add('p',msg||'Pon tu nombre y un PIN de 4 dígitos. Para unirte, el del grupo; para crear uno, el que quieras (vacío = aleatorio).');
  const nm=add('input','');nm.placeholder='Tu nombre';nm.maxLength=12;nm.value=LS('abxn');
  const i=add('input','');i.placeholder='PIN';i.maxLength=4;i.inputMode='numeric';i.value=PRE;
  const go=t=>()=>{SS('abxn',nm.value.trim());wsend({t:'hi',code:myCode,name:nm.value.trim()});wsend({t,pin:i.value,name:nm.value.trim(),df})};
  add('button','Crear grupo (máx. 4 jugadores)','pri').onclick=go('create');
  add('button','Unirme con PIN').onclick=go('join');
  const shS=(msg&&msg.startsWith('No se pudo'))||LS('abxs')||(location.hostname||'').endsWith('github.io'),sv=add('input','');sv.style.display=shS?'':'none';sv.placeholder='Servidor (ej. mi-juego.up.railway.app)';sv.style.fontSize='14px';sv.value=LS('abxs');
  {const cb=add('button','Conectar a este servidor');cb.style.display=shS?'':'none';cb.onclick=()=>{SS('abxs',sv.value.trim());closeNet(1);openNet()}}
  add('button','Cerrar').onclick=()=>{closeNet();nt.style.display='none'}}
 else{add('h2','Entra con este PIN');const pn=add('p',net.pin);pn.style.cssText='font-size:56px;font-weight:700;letter-spacing:8px;color:#ffd23f;min-height:0';
  const u=joinUrl(),q=qrCanvas(u);if(q){q.style.cssText='width:170px;height:170px;image-rendering:pixelated;border-radius:10px';nt.appendChild(q)}
  const lk=add('p',u);lk.style.cssText='font-size:11px;word-break:break-all;max-width:320px;opacity:.75;user-select:text';
  add('p','Jugadores: '+net.ps.length+'/4');
  net.ps.forEach((id,n)=>add('p',((net.ns||[])[n]||'Jugador '+(n+1))+(id===net.hostId?' (admin)':'')+(id===net.id?' — tú':'')));
  if(net.host)add('button','Dificultad: '+DF[df][0]).onclick=()=>{df=(df+1)%4;save();wsend({t:'cfg',df});netUI()};
  else add('p','Dificultad: '+DF[df][0]);
  fr.filter(f=>pres[f.c]&&pres[f.c].st==='menu'&&net.ps.length<4).forEach(f=>{const b=add('button',invd[f.c]?'Invitado: '+f.n:'Invitar a '+f.n);b.disabled=!!invd[f.c];b.onclick=()=>{invd[f.c]=1;wsend({t:'inv',to:f.c,pin:net.pin});netUI()}});
  add('button','Amigos').onclick=()=>frUI();
  if(net.host)add('button','Empezar partida','pri').onclick=()=>wsend({t:'start'});
  else add('p','Esperando a que el admin empiece…');
  add('button','Salir del grupo').onclick=()=>{closeNet();openNet()}}
 nt.style.display='flex'}
// ---- mensajes del servidor ----
function netMsg(m){const t=m.t;
 if(t==='err')netUI(m.m);
 else if(t==='lobby'){net.id=m.you;net.hostId=m.host;net.host=m.host===m.you;net.pin=m.pin;net.ps=m.ps;net.ns=m.ns||[];
  if(!net.host){if(net.sdf==null)net.sdf=df;df=m.df|0}
  frp.style.display='none';lbp.style.display='none';chS='r';netUI()}
 else if(t==='start'){if(!net.host)df=m.df|0;startOnline(m.ps,m.ns)}
 else if(t==='left')delete rp[m.id];
 else if(t==='closed'){if(state!=='over')leaveNet('El admin cerró el grupo.')}
 else if(t==='m')onRelay(m.from,m.d);
 else if(t==='pres'){pres=m.on||{};if(frp.style.display==='flex'&&(document.activeElement||{}).tagName!=='INPUT')frUI();if(net.pin&&!net.on&&nt.style.display==='flex')netUI()}
 else if(t==='freq')toast(m.name+' quiere ser tu amigo',[['Aceptar',()=>{addFriend(m.from,m.name);wsend({t:'facc',to:m.from})}],['Ignorar']]);
 else if(t==='facc'){addFriend(m.from,m.name);toast(m.name+' ahora es tu amigo');if(frp.style.display==='flex')frUI()}
 else if(t==='ferr'){if(frp.style.display==='flex')frUI(m.m)}
 else if(t==='inv'){if(net.pin||net.on)return;toast(m.from+' te invita a su grupo',[['Unirme',()=>{frp.style.display='none';wsend({t:'join',pin:m.pin,name:LS('abxn').trim()})}],['Ignorar']])}
 else if(t==='chat')chAdd(m.s,m.n,m.x);
 else if(t==='hist')chat.g=m.a.slice()}
function startOnline(ps,ns){net.nm={};ps.forEach((id,i)=>{net.nm[id]=(ns&&ns[i])||'Jugador '+(i+1)});net.on=true;net.brk=false;np=ps.length;mi=ps.indexOf(net.id);kills=0;mk=0;ld=0;rpv={};
 for(const k in rp)delete rp[k];
 ps.forEach((id,i)=>{if(id!==net.id)rp[id]={x:SP[i][0],y:SP[i][1],a:0,st:1,iv:1,sk:0,dm:0}});
 nt.style.display='none';frp.style.display='none';cp.style.display='none';reset(false)}
function onRelay(from,d){
 if(net.host){
  if(d.k==='p'){const r=rp[from]||(rp[from]={dm:0});Object.assign(r,{x:+d.x,y:+d.y,a:+d.a,st:d.st|0,iv:d.iv|0,sk:d.sk|0})}
  else if(d.k==='f'&&d.s&&state!=='between')shots.push({x:+d.s.x,y:+d.s.y,dx:+d.s.dx,dy:+d.s.dy,z:d.s.z|0,d:Math.min(12,+d.s.d||1),k:d.s.k|0})}
 else if(d.k==='s')onSnap(d);
 else if(d.k==='wd'){pts+=Math.round(25*DF[df][4]);save();sfx('win');if(state==='play')state='between';bkShow(d.t||20)}
 else if(d.k==='nw'){wave=d.w-1;reset(true)}
 else if(d.k==='end'){score=d.sc;if(d.w){pts+=Math.round(100*DF[df][4]);end('Infección eliminada','Has superado las 10 oleadas. ¡Ganaste!','Jugar de nuevo')}else end('Te han infectado','Las bacterias ganaron esta vez.','Jugar de nuevo')}}
function onSnap(d){foes=d.f.map(a=>({x:a[0],y:a[1],fl:a[2]}));shots=d.s.map(a=>({x:a[0],y:a[1],z:a[2],k:a[3]}));
 rpv=d.pl;wave=d.w;total=d.n;score=d.sc;if(d.df!=null)df=d.df|0;
 if(d.kl>mk){pts+=Math.round((d.kl-mk)*10*DF[df][4]);mk=d.kl;save();sfx('pop')}
 const m=d.dm[net.id]||0;if(m>ld){if(state==='play'&&inv<=0){hp-=m-ld;hurt=.45;if(hsfx<=0){sfx('hurt');hsfx=.4}}ld=m}}
function hostSnap(dt){sa+=dt;if(sa<.05)return;sa=0;
 const r2=v=>+v.toFixed(2),pl={},dm={};
 pl[net.id]=[r2(px),r2(py),sk,state==='quiz'?2:state==='spec'?0:1,r2(pa)];
 for(const id in rp){const r=rp[id];pl[id]=[r2(r.x),r2(r.y),r.sk|0,r.st,r2(r.a||0)];dm[id]=r2(r.dm)}
 tx2({k:'s',f:foes.map(f=>[r2(f.x),r2(f.y),f.fl>0?1:0]),s:shots.map(s=>[r2(s.x),r2(s.y),s.z,s.k|0]),pl,dm,w:wave,n:total,sc:score,kl:kills,df})}
function others(){if(!net.on)return[];
 if(net.host)return Object.keys(rp).filter(id=>rp[id].st).map(id=>[rp[id].x,rp[id].y,rp[id].sk|0,(net.nm||{})[id]]);
 return Object.keys(rpv).filter(id=>+id!==net.id&&rpv[id][3]).map(id=>[rpv[id][0],rpv[id][1],rpv[id][2],(net.nm||{})[id]])}
setInterval(()=>{if(net.on&&!net.host)tx2({k:'p',x:px,y:py,a:pa,st:state==='quiz'?2:(state==='spec'||state==='over')?0:1,iv:inv>0?1:0,sk},1)},50);
// ---- modo espectador ----
function spList(){if(!net.on)return[];
 if(net.host)return Object.keys(rp).filter(id=>rp[id].st==1).map(id=>({id,x:rp[id].x,y:rp[id].y,a:rp[id].a||0}));
 return Object.keys(rpv).filter(id=>+id!==net.id&&rpv[id][3]==1).map(id=>({id,x:rpv[id][0],y:rpv[id][1],a:rpv[id][4]||0}))}
function enterSpec(){state='spec';spT=0;toast('Has sido eliminado. Observas a tus compañeros hasta la siguiente oleada.')}
function specNext(){const l=spList();if(!l.length)return;const i=l.findIndex(o=>o.id==spT);spT=l[(i+1)%l.length].id}
function specCam(){const l=spList();if(!l.length)return;const t=l.find(o=>o.id==spT)||l[0];spT=t.id;px+=(t.x-px)*.3;py+=(t.y-py)*.3;pa+=Math.atan2(Math.sin(t.a-pa),Math.cos(t.a-pa))*.3}
// ---- amigos ----
function addFriend(c,n){if(c===myCode||fr.some(f=>f.c===c))return;fr.push({c,n});SS('abxf',JSON.stringify(fr))}
function frUI(msg){frp.innerHTML='';const add=mkAdd(frp);
 add('h2','Amigos');
 const me=add('p','Tu código: '+myCode);me.style.cssText='font-size:30px;font-weight:700;letter-spacing:4px;color:#ffd23f;min-height:0';
 add('p',msg||(net.ws&&net.ws.readyState===1?'Pasa tu código a un amigo o añade el suyo.':'Sin conexión con el servidor: no se ve quién está en línea.'));
 fr.forEach(f=>{const p=pres[f.c],on=!!p;const st=on?(p.st==='game'?'en partida':p.st==='lobby'?'en un grupo':'en línea'):'desconectado';
  const l=add('p','● '+f.n+' ('+st+')');l.style.color=on?'#7fe08a':'#9a8a80';
  const row=document.createElement('div');row.style.cssText='display:flex;gap:6px;width:min(380px,100%)';
  const bi=document.createElement('button'),bq=document.createElement('button');bi.textContent=invd[f.c]?'Invitado':'Invitar';bq.textContent='Quitar';
  bi.style.cssText='width:auto;flex:1;padding:8px';bq.style.cssText='width:auto;flex:1;padding:8px';
  bi.disabled=!(on&&net.pin&&!net.on&&net.ps.length<4&&p.st==='menu'&&!invd[f.c]);
  bi.onclick=()=>{invd[f.c]=1;wsend({t:'inv',to:f.c,pin:net.pin});frUI()};
  bq.onclick=()=>{fr=fr.filter(x=>x.c!==f.c);SS('abxf',JSON.stringify(fr));frUI()};
  row.appendChild(bi);row.appendChild(bq);frp.appendChild(row)});
 const i=add('input','');i.placeholder='Código de tu amigo';i.maxLength=6;i.style.textTransform='uppercase';
 add('button','Añadir amigo','pri').onclick=()=>{const c=i.value.trim().toUpperCase();if(c===myCode)return frUI('Ese es tu propio código.');if(c.length<6)return frUI('Escribe un código de 6 caracteres.');wsend({t:'freq',to:c});frUI('Solicitud enviada (si el jugador está en línea la recibirá).')};
 add('button','Cerrar').onclick=()=>{frp.style.display='none'};
 frp.style.display='flex'}
frb.onclick=()=>{connect(true);frUI();if(fr.length)wsend({t:'pres',codes:fr.map(f=>f.c)})};
setInterval(()=>{if(fr.length&&net.ws&&net.ws.readyState===1)wsend({t:'pres',codes:fr.map(f=>f.c)})},6000);
// ---- ranking ----
function submitScore(){if(score<=0)return;try{fetch(httpBase()+'/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({n:myName(),s:score,w:wave,d:df,m:net.on?'coop':'solo'})}).catch(()=>{})}catch(e){}}
function lbUI(){lbp.innerHTML='';const add=mkAdd(lbp);add('h2','Ranking');const st=add('p','Cargando…');
 const o=document.createElement('div');o.style.cssText='width:min(420px,100%);text-align:left';lbp.appendChild(o);
 add('button','Cerrar','pri').onclick=()=>{lbp.style.display='none'};lbp.style.display='flex';
 fetch(httpBase()+'/scores').then(r=>r.json()).then(a=>{st.textContent=a.length?'Mejores puntuaciones':'Aún no hay puntuaciones. ¡Sé el primero!';
  a.slice(0,15).forEach((e,i)=>{const d=document.createElement('div');d.textContent=(i+1)+'. '+e.n+' — '+e.s+' pts (oleada '+e.w+', '+(DF[e.d]||[''])[0]+', '+(e.m==='coop'?'cooperativo':'solo')+')';d.style.cssText='padding:4px 0;border-bottom:1px solid rgba(246,230,214,.15);font-size:14px';o.appendChild(d)})}).catch(()=>{st.textContent='No se pudo cargar el ranking. Abre el juego desde tu servidor (o escribe su dirección en Jugar online).'})}
rkb.onclick=lbUI;
dfb.textContent='Dificultad: '+DF[df][0];dfb.onclick=()=>{df=(df+1)%4;save();dfb.textContent='Dificultad: '+DF[df][0]};
// ---- chat ----
function chAdd(s,n,x){const a=chat[s];a.push([n,x]);if(a.length>60)a.shift();
 if(cp.style.display==='flex'){if(chS===s)chRender();else chb.className='n'}
 else{chb.className='n';const d=document.createElement('div');d.textContent=n+': '+x;cl.appendChild(d);while(cl.children.length>5)cl.children[0].remove();setTimeout(()=>d.remove(),8000)}}
function chRender(){cpl.innerHTML='';chat[chS].forEach(([n,x])=>{const d=document.createElement('div');d.textContent=n+': '+x;cpl.appendChild(d)});cpl.scrollTop=1e9;cpg.className=chS==='g'?'on':'';cpr.className=chS==='r'?'on':''}
function chSys(x){chat[chS].push(['Sistema',x]);chRender()}
chb.onclick=()=>{if(cp.style.display==='flex'){cp.style.display='none';return}cp.style.display='flex';chb.className='';cl.innerHTML='';chS=net.pin?'r':'g';connect(true);chRender();cin.focus()};
cpx.onclick=()=>{cp.style.display='none'};
cpg.onclick=()=>{chS='g';chRender()};cpr.onclick=()=>{chS='r';chRender()};
cse.onclick=()=>{const x=cin.value.trim();if(!x)return;if(!(net.ws&&net.ws.readyState===1))return chSys('Sin conexión con el servidor.');if(chS==='r'&&!net.pin)return chSys('No estás en un grupo.');wsend({t:'chat',s:chS,x});cin.value=''};
cin.onkeydown=e=>{if(e.key==='Enter')cse.onclick()};
connect(true);
if(PRE)setTimeout(openNet,300);
let lt=0,ltT=null;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<350&&e.target===ltT&&e.target.tagName!=='INPUT')e.preventDefault();lt=n;ltT=e.target},{passive:false});
['gesturestart','gesturechange','dblclick'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
wb.onclick=()=>{if(state==='spec')specNext();else cycleWp()};addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='KeyQ'){if(state==='spec')specNext();else cycleWp()}if(e.code==='Enter')chb.onclick()});let lp=null,lx=0;
cv.addEventListener('pointerdown',e=>{lp=e.pointerId;lx=e.clientX;cv.setPointerCapture(lp)});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==lp)return;if(state==='play')pa+=(e.clientX-lx)*.006;lx=e.clientX});
cv.addEventListener('pointerup',()=>{lp=null});cv.addEventListener('pointercancel',()=>{lp=null});
let jp=null;const R=50;
function mv(e){const r=js.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;const l=Math.hypot(x,y);if(l>R){x*=R/l;y*=R/l}jx=x/R;jy=y/R;kn.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`}
js.onpointerdown=e=>{jp=e.pointerId;js.setPointerCapture(jp);mv(e)};
js.onpointermove=e=>{if(e.pointerId===jp)mv(e)};
js.onpointerup=js.onpointercancel=()=>{jp=null;jx=jy=0;kn.style.transform='translate(-50%,-50%)'};
fb.onpointerdown=e=>{fire=true;fb.setPointerCapture(e.pointerId)};
fb.onpointerup=fb.onpointercancel=()=>{fire=false};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.code]=true;if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('contextmenu',e=>e.preventDefault());
reset();state='menu';ov.style.display='flex';
requestAnimationFrame(loop);
</script>
